<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成品展示｜学员原创作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            position: relative;
            background: #f5f0e8;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #3d2b1f;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 汉堡菜单 ===== */
        .hamburger {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            border-radius: 6px;
            transition: background-color 0.2s;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .hamburger:active {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #8b1a1a;
            margin: 3px 0;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        /* ===== 遮罩层 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 200;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ===== 导航抽屉 ===== */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 75%;
            max-width: 300px;
            height: 100%;
            background-color: #fffdf8;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 300;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            padding-top: 60px;
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 0 24px 20px;
            border-bottom: 1px solid #e8d5b5;
            font-size: 18px;
            font-weight: 700;
            color: #8b1a1a;
        }

        .nav-list {
            list-style: none;
            padding: 8px 0;
        }

        .nav-item {
            padding: 16px 24px;
            font-size: 16px;
            color: #3d2b1f;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        .nav-item:active {
            background-color: #fdf6ec;
        }

        .nav-item.active {
            color: #8b1a1a;
            background: linear-gradient(90deg, rgba(139, 26, 26, 0.08), transparent);
            border-left: 3px solid #8b1a1a;
            padding-left: 21px;
        }

        /* ===== 公共样式：article / hero ===== */
        .article {
            max-width: 680px;
            margin: 0 auto;
            background: #fffdf8;
            overflow: hidden;
        }

        .hero {
            background: linear-gradient(135deg, #8b1a1a 0%, #6b1212 50%, #4a0e0e 100%);
            padding: 50px 30px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(90deg,
                    transparent, transparent 38px,
                    rgba(255,215,0,0.06) 38px, rgba(255,215,0,0.06) 40px);
            pointer-events: none;
        }

        .hero-pattern {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
        }

        .hero-pattern span {
            width: 26px;
            height: 4px;
            border-radius: 2px;
        }

        .hero-pattern span:nth-child(1) { background: #e8c547; }
        .hero-pattern span:nth-child(2) { background: #f5f0e8; }
        .hero-pattern span:nth-child(3) { background: #c9a96e; }
        .hero-pattern span:nth-child(4) { background: #e8c547; }
        .hero-pattern span:nth-child(5) { background: #f5f0e8; }

        .hero h1 {
            color: #f5e6c8;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.6;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .hero h1 .highlight {
            color: #e8c547;
        }

        .hero-sub {
            margin-top: 16px;
            color: rgba(245, 230, 200, 0.8);
            font-size: 14px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .hero-corner {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            border: 2px solid rgba(232, 197, 71, 0.4);
            border-radius: 50%;
            position: relative;
            margin-top: 20px;
        }

        .hero-corner::after {
            content: "✦";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e8c547;
            font-size: 20px;
        }

        /* ===== 成品展示：双列瀑布流 ===== */
        .gallery-content {
            padding: 24px 16px 40px;
        }

        .gallery-intro {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #fdf6ec 0%, #fbeede 100%);
            border-radius: 12px;
            border-left: 3px solid #8b1a1a;
            border-right: 3px solid #8b1a1a;
            font-size: 14px;
            color: #5c3d2e;
            line-height: 1.7;
        }

        .gallery-intro strong {
            color: #8b1a1a;
            font-weight: 700;
        }

        .gallery-hint {
            margin-top: 10px;
            font-size: 12.5px;
            color: #a08060;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .waterfall {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .waterfall-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gallery-card {
            background: #fffdf8;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(139, 26, 26, 0.08);
            border: 1px solid #f0e0cc;
            break-inside: avoid;
        }

        .gallery-card-img {
            width: 100%;
            display: block;
            background: #f5ead6;
        }

        .gallery-card-caption {
            padding: 12px 14px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gallery-card-caption::before {
            content: "✦";
            color: #c9a96e;
            font-size: 12px;
            flex-shrink: 0;
        }

        .gallery-card-caption span {
            font-size: 14px;
            color: #3d2b1f;
            font-weight: 600;
            line-height: 1.4;
        }

        /* ===== 卡片轮播预览（Lightbox） ===== */
        .lightbox-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            opacity: 0;
            transition: opacity 0.22s ease;
        }

        .lightbox-mask.show {
            display: flex;
            opacity: 1;
        }

        .lightbox-card {
            width: 80%;
            max-width: 336px;
            background: #fffdf8;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            transform: scale(0.96);
            opacity: 0;
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease;
            touch-action: pan-y;
        }

        .lightbox-mask.show .lightbox-card {
            transform: scale(1);
            opacity: 1;
        }

        .lightbox-img-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #f5ead6;
            user-select: none;
            -webkit-user-select: none;
        }

        .lightbox-img-track {
            display: flex;
            transition: transform 0.3s ease;
            will-change: transform;
            width: 100%;
        }

        .lightbox-img-track.dragging {
            transition: none;
        }

        .lightbox-img-item {
            width: 100%;
            flex-shrink: 0;
            display: block;
            min-height: 260px;
            object-fit: cover;
            background: #f5ead6;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 253, 248, 0.85);
            border: none;
            color: #8b1a1a;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            z-index: 2;
            transition: transform 0.12s;
        }

        .lightbox-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }

        .lightbox-arrow.prev {
            left: 10px;
        }

        .lightbox-arrow.next {
            right: 10px;
        }

        .lightbox-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .lightbox-meta {
            padding: 14px 18px 18px;
        }

        .lightbox-title {
            font-size: 16px;
            font-weight: 700;
            color: #3d2b1f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lightbox-title::before {
            content: "✦";
            color: #c9a96e;
            font-size: 12px;
        }

        .lightbox-dots {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            min-height: 8px;
        }

        .lightbox-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e8d5b5;
            transition: all 0.2s;
        }

        .lightbox-dot.active {
            background: #8b1a1a;
            width: 18px;
            border-radius: 3px;
        }

        /* ===== Toast 无更多图片提示 ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            letter-spacing: 1px;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 汉堡菜单 -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 导航抽屉 -->
    <div class="drawer" id="drawer">
        <div class="drawer-header">菜单</div>
        <ul class="nav-list">
            <li class="nav-item" data-href="index.html">课程介绍</li>
            <li class="nav-item active" data-href="gallery.html">成品展示</li>
            <li class="nav-item" data-href="environment.html">环境设施</li>
            <li class="nav-item" data-href="contact.html">联系咨询</li>
        </ul>
    </div>

    <!-- 成品展示：双列瀑布流 -->
    <div class="article">
        <div class="hero">
            <div class="hero-pattern">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <h1><span class="highlight">成品展示</span><br>学员原创作品集</h1>
            <div class="hero-sub">精工细作 · 匠心传承</div>
            <div class="hero-corner"></div>
        </div>
        <div class="gallery-content">
            <div class="gallery-intro">
                <strong>一对一精工教学成果</strong><br>
                每一件作品都是学员亲手缝制，从版型到细节全流程独立完成
                <div class="gallery-hint">点击图片看更多学员作品</div>
            </div>
            <div class="waterfall" id="waterfall">
                <div class="waterfall-col" id="col-left"></div>
                <div class="waterfall-col" id="col-right"></div>
            </div>
        </div>
    </div>

    <!-- 卡片轮播预览（Lightbox） -->
    <div class="lightbox-mask" id="lightboxMask">
        <div class="lightbox-card" id="lightboxCard">
            <div class="lightbox-img-wrap" id="lightboxImgWrap">
                <button class="lightbox-arrow prev" id="lightboxPrev">‹</button>
                <button class="lightbox-arrow next" id="lightboxNext">›</button>
                <div class="lightbox-img-track" id="lightboxTrack"></div>
            </div>
            <div class="lightbox-meta">
                <div class="lightbox-title" id="lightboxTitle">作品展示</div>
                <div class="lightbox-dots" id="lightboxDots"></div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="simpleToast">暂无更多图片</div>

    <script>
        const hamburger = document.getElementById('hamburger');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');

        function openDrawer() {
            drawer.classList.add('active');
            overlay.classList.add('active');
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        }

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            if (drawer.classList.contains('active')) {
                closeDrawer();
            } else {
                openDrawer();
            }
        });

        overlay.addEventListener('click', closeDrawer);

        /* 导航项点击：跳转到对应的独立 HTML 文件 */
        document.querySelectorAll('.nav-item').forEach(function(item) {
            item.addEventListener('click', function() {
                closeDrawer();
                const href = this.getAttribute('data-href');
                if (href && href !== window.location.pathname.split('/').pop()) {
                    window.location.href = href;
                }
            });
        });

        /* ===== 成品展示：双列瀑布流（奇偶交替分配 + 参差高度） ===== */
        /* show 文件名 → 对应 type 目录（如无则 undefined） */
        const showImgToTypeDir = {
            'img3': 'type3',
            'img5': 'type5',
            'img6': 'type6',
            'img7': 'type7',
            'img10': 'type10',
            'img11': 'type11',
            'img12': 'type12'
        };

        /* 每个 type 目录内静态列出的图片文件名（按目录实际存在文件整理） */
        const typeDirImages = {
            'type3': ['66b027a7bbd36367603839cc8d4e4775.jpg', '微信图片_20260815090441_103_1116.jpg'],
            'type5': ['img1.jpg', '77178fdf5c6614a339a21c3e5a91233b.jpg', '827d06954b3b81daa5d8775a75c12914.png'],
            'type6': ['微信图片_20260815085935_511_78.jpg', 'Snipaste_2026-08-15_20-56-31.jpg'],
            'type7': ['img1.jpg', '5ec03b40c8ab54b674228b4148aea978.jpg', '微信图片_20260815085930_507_78.jpg', '微信图片_20260815085932_508_78.jpg'],
            'type10': ['img10.jpg', 'b96040df7a021a9f26676aabc0aef3a4.jpg'],
            'type11': ['img11.jpg', '965d817b5aed000ad2a18554c1eab8cc.jpg', '微信图片_20260815085807_506_78.jpg'],
            'type12': ['72c2a7bbb44b752c36a29bd7d4623a2a.jpg', '微信图片_20260815085806_505_78.jpg', '微信图片_20260815085933_509_78.jpg']
        };

        function extractShowKey(imgPath) {
            const m = imgPath && imgPath.match(/[\/\\](img\d+)(?:\.[^.\/\\]+)?$/);
            return m ? m[1] : null;
        }

        /* 根据 galleryData 条目拿到轮播图片列表，拿不到返回 null 表示无图 */
        function getCarouselImages(item) {
            const key = extractShowKey(item.img);
            const typeDir = key ? showImgToTypeDir[key] : null;
            if (!typeDir) return null;
            const files = typeDirImages[typeDir];
            if (!files || files.length === 0) return null;
            return files.map(function(f) {
                return 'image/' + typeDir + '/' + f;
            });
        }

        const galleryData = [
            { img: 'image/show/img2.jpg', title: '藏式A字裙' },
            { img: 'image/show/img3.jpg', title: '藏式一片裙' },
            { img: 'image/show/img4.jpg', title: '女士藏式裤装' },
            { img: 'image/show/img5.jpg', title: 'V型立领斜襟' },
            { img: 'image/show/img6.jpg', title: '翻领对门禁（博拉衬衫）' },
            { img: 'image/show/img7.jpg', title: '藏式马甲' },
            { img: 'image/show/img8.jpg', title: '有帽卫衣' },
            { img: 'image/show/img9.jpg', title: '青果领外套' },
            { img: 'image/show/img10.jpg', title: '藏袍' },
            { img: 'image/show/img11.jpg', title: '西式藏装（无袖博拉）' },
            { img: 'image/show/img12.jpg', title: '藏式外套' }
        ];

        let galleryInitialized = false;

        function initWaterfall() {
            if (galleryInitialized) return;
            galleryInitialized = true;

            const colLeft = document.getElementById('col-left');
            const colRight = document.getElementById('col-right');
            if (!colLeft || !colRight) return;

            galleryData.forEach(function(item, index) {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.innerHTML =
                    '<img class="gallery-card-img" src="' + item.img + '" alt="' + item.title + '">' +
                    '<div class="gallery-card-caption"><span>' + item.title + '</span></div>';

                card.addEventListener('click', function() {
                    openCarousel(item);
                });

                if (index % 2 === 0) {
                    colLeft.appendChild(card);
                } else {
                    colRight.appendChild(card);
                }
            });
        }

        /* ===== 轮播预览（Lightbox） ===== */
        let carouselImages = [];
        let carouselIndex = 0;

        const lightboxMask = document.getElementById('lightboxMask');
        const lightboxCard = document.getElementById('lightboxCard');
        const lightboxTrack = document.getElementById('lightboxTrack');
        const lightboxDots = document.getElementById('lightboxDots');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const simpleToast = document.getElementById('simpleToast');

        function openCarousel(item) {
            const images = getCarouselImages(item);
            if (!images) {
                showToast('暂无更多图片');
                return;
            }
            carouselImages = images;
            carouselIndex = 0;
            renderCarousel(item.title);
            requestAnimationFrame(function() {
                if (lightboxMask) lightboxMask.classList.add('show');
                document.body.style.overflow = 'hidden';
                updateCarousel(true);
            });
        }

        function closeCarousel() {
            if (lightboxMask) lightboxMask.classList.remove('show');
            document.body.style.overflow = '';
            if (lightboxTrack) {
                lightboxTrack.innerHTML = '';
                lightboxTrack.style.transform = '';
            }
            if (lightboxDots) lightboxDots.innerHTML = '';
        }

        function renderCarousel(title) {
            if (lightboxTitle) lightboxTitle.textContent = title || '作品展示';
            if (!lightboxTrack || !lightboxDots) return;
            lightboxTrack.innerHTML = '';
            lightboxDots.innerHTML = '';
            carouselImages.forEach(function(src, i) {
                const img = document.createElement('img');
                img.className = 'lightbox-img-item';
                img.src = src;
                img.draggable = false;
                lightboxTrack.appendChild(img);

                const dot = document.createElement('span');
                dot.className = 'lightbox-dot';
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    goToSlide(i);
                });
                lightboxDots.appendChild(dot);
            });
            bindSwipe();
        }

        function updateCarousel(instant) {
            if (!lightboxTrack) return;
            if (instant) {
                requestAnimationFrame(function() {
                    lightboxTrack.classList.add('dragging');
                    lightboxTrack.style.transform = 'translateX(' + (-carouselIndex * 100) + '%)';
                    requestAnimationFrame(function() {
                        lightboxTrack.classList.remove('dragging');
                    });
                });
            } else {
                lightboxTrack.style.transform = 'translateX(' + (-carouselIndex * 100) + '%)';
            }
            const dots = lightboxDots ? lightboxDots.querySelectorAll('.lightbox-dot') : [];
            dots.forEach(function(d, i) {
                d.classList.toggle('active', i === carouselIndex);
            });
            if (lightboxPrev) lightboxPrev.disabled = carouselIndex <= 0;
            if (lightboxNext) lightboxNext.disabled = carouselIndex >= carouselImages.length - 1;
        }

        function goToSlide(idx) {
            if (!carouselImages.length) return;
            carouselIndex = Math.max(0, Math.min(carouselImages.length - 1, idx));
            updateCarousel(false);
        }

        function prevSlide() { goToSlide(carouselIndex - 1); }
        function nextSlide() { goToSlide(carouselIndex + 1); }

        if (lightboxPrev) {
            lightboxPrev.addEventListener('click', function(e) {
                e.stopPropagation();
                prevSlide();
            });
        }
        if (lightboxNext) {
            lightboxNext.addEventListener('click', function(e) {
                e.stopPropagation();
                nextSlide();
            });
        }

        /* 点击遮罩（但不是卡片内部）关闭 */
        if (lightboxMask) {
            lightboxMask.addEventListener('click', function(e) {
                if (e.target === lightboxMask) closeCarousel();
            });
        }

        /* ===== 左右滑动（触摸 & 鼠标拖拽） ===== */
        let swipeStartX = 0;
        let swipeStartY = 0;
        let swipeDeltaX = 0;
        let swipeActive = false;
        let swipeWrapWidth = 0;

        function bindSwipe() {
            const wrap = document.getElementById('lightboxImgWrap');
            if (!wrap) return;

            wrap.onmousedown = handleStart;
            wrap.ontouchstart = handleStart;
            wrap.onmousemove = handleMove;
            wrap.ontouchmove = handleMove;
            wrap.onmouseup = handleEnd;
            wrap.ontouchend = handleEnd;
            wrap.onmouseleave = handleEnd;
            wrap.ontouchcancel = handleEnd;
        }

        function getPointX(e) {
            if (e.touches && e.touches.length) return e.touches[0].clientX;
            if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
            return e.clientX;
        }
        function getPointY(e) {
            if (e.touches && e.touches.length) return e.touches[0].clientY;
            if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
            return e.clientY;
        }

        function handleStart(e) {
            if (!carouselImages.length) return;
            swipeStartX = getPointX(e);
            swipeStartY = getPointY(e);
            swipeDeltaX = 0;
            swipeActive = true;
            swipeWrapWidth = document.getElementById('lightboxImgWrap').offsetWidth || 1;
            if (lightboxTrack) lightboxTrack.classList.add('dragging');
        }

        function handleMove(e) {
            if (!swipeActive) return;
            const x = getPointX(e);
            const y = getPointY(e);
            const dx = x - swipeStartX;
            const dy = y - swipeStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 4) {
                e.preventDefault && e.preventDefault();
            }
            swipeDeltaX = dx;
            if (lightboxTrack) {
                const basePct = -carouselIndex * 100;
                const dragPct = (dx / swipeWrapWidth) * 100;
                lightboxTrack.style.transform = 'translateX(calc(' + basePct + '% + ' + dx + 'px))';
            }
        }

        function handleEnd() {
            if (!swipeActive) return;
            swipeActive = false;
            if (lightboxTrack) lightboxTrack.classList.remove('dragging');
            const threshold = swipeWrapWidth * 0.18;
            if (swipeDeltaX > threshold) {
                prevSlide();
            } else if (swipeDeltaX < -threshold) {
                nextSlide();
            } else {
                updateCarousel(false);
            }
            swipeDeltaX = 0;
        }

        /* ===== Toast ===== */
        let toastTimer = null;
        function showToast(msg) {
            if (!simpleToast) return;
            simpleToast.textContent = msg || '';
            simpleToast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                simpleToast.classList.remove('show');
            }, 1400);
        }

        /* DOM 就绪直接初始化瀑布流 */
        document.addEventListener('DOMContentLoaded', function() {
            initWaterfall();
        });
    </script>
</body>
</html>
