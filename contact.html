<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自助咨询｜藏服培训课程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            position: relative;
            background: #f5f0e8;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #3d2b1f;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 汉堡菜单 ===== */
        .hamburger {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            border-radius: 6px;
            transition: background-color 0.2s;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .hamburger:active {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #8b1a1a;
            margin: 3px 0;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        /* ===== 遮罩层 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 200;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ===== 导航抽屉 ===== */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 75%;
            max-width: 300px;
            height: 100%;
            background-color: #fffdf8;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 300;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            padding-top: 60px;
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 0 24px 20px;
            border-bottom: 1px solid #e8d5b5;
            font-size: 18px;
            font-weight: 700;
            color: #8b1a1a;
        }

        .nav-list {
            list-style: none;
            padding: 8px 0;
        }

        .nav-item {
            padding: 16px 24px;
            font-size: 16px;
            color: #3d2b1f;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        .nav-item:active {
            background-color: #fdf6ec;
        }

        .nav-item.active {
            color: #8b1a1a;
            background: linear-gradient(90deg, rgba(139, 26, 26, 0.08), transparent);
            border-left: 3px solid #8b1a1a;
            padding-left: 21px;
        }

        /* ===== 联系咨询：聊天界面 ===== */
        body#contact-page {
            min-height: 100vh;
            min-height: 100dvh;
        }

        #contact-page .article {
            max-width: 680px;
            margin: 0 auto;
            background: #f5f0e8;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏 AppBar */
        .chat-appbar {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 52px;
            background: #fffdf8;
            border-bottom: 1px solid #e8d5b5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            box-shadow: 0 1px 4px rgba(139, 26, 26, 0.06);
            flex-shrink: 0;
        }

        .chat-appbar-title {
            font-size: 17px;
            font-weight: 700;
            color: #3d2b1f;
            letter-spacing: 1px;
        }

        /* 消息滚动区域 */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 14px calc(24px + 86px);
            -webkit-overflow-scrolling: touch;
        }

        /* 机器人消息（对方气泡） */
        .msg-row {
            width: 100%;
            display: flex;
            margin-bottom: 18px;
        }

        .msg-row-other {
            justify-content: flex-start;
            align-items: flex-start;
        }

        .msg-main {
            max-width: 78%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .msg-bubble {
            background: #fff;
            border-radius: 6px 14px 14px 14px;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.65;
            color: #3d2b1f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            word-break: break-word;
        }

        /* 用户消息（我方气泡） */
        .msg-row-self {
            justify-content: flex-end;
            align-items: flex-start;
        }

        .msg-row-self .msg-main {
            align-items: flex-end;
        }

        .msg-row-self .msg-bubble {
            background: linear-gradient(135deg, #8b1a1a, #6b1212);
            color: #f5e6c8;
            border-radius: 14px 6px 14px 14px;
            box-shadow: 0 2px 8px rgba(139, 26, 26, 0.18);
        }

        /* 快捷问题按钮组 */
        .quick-group {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-btn {
            width: 100%;
            background: #fffdf8;
            border: 1.5px solid #e8d5b5;
            border-radius: 28px;
            padding: 14px 20px;
            font-size: 14.5px;
            color: #5c3d2e;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .quick-btn::before {
            content: "?";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8c547, #d4a838);
            color: #4a0e0e;
            font-size: 13px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .quick-btn:active {
            background: #fdf6ec;
            border-color: #c9a96e;
            transform: scale(0.98);
        }

        /* ===== 底部通栏：联系老师（固定悬浮） ===== */
        .contact-footer-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 90;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 253, 248, 0.92);
            backdrop-filter: blur(6px);
            border-top: 1px solid #e8d5b5;
            box-shadow: 0 -2px 12px rgba(139, 26, 26, 0.08);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .contact-footer-btn {
            display: block;
            width: 100%;
            height: 46px;
            background: linear-gradient(135deg, #8b1a1a 0%, #6b1212 100%);
            color: #e8c547;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(139, 26, 26, 0.28);
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .contact-footer-btn::before {
            content: "";
            display: inline-block;
            width: 18px;
            height: 18px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8c547' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'/></svg>");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .contact-footer-btn:active {
            transform: scale(0.98);
        }

        /* ===== 联系老师弹窗 ===== */
        .contact-dialog-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.22s ease;
        }

        .contact-dialog-mask.show {
            display: flex;
            opacity: 1;
        }

        .contact-dialog-card {
            width: 100%;
            max-width: 340px;
            background: #fff;
            border-radius: 20px;
            padding: 12px 4px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
            transform: scale(0.92);
            opacity: 0;
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease;
        }

        .contact-dialog-mask.show .contact-dialog-card {
            transform: scale(1);
            opacity: 1;
        }

        .contact-dialog-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            gap: 12px;
        }

        .contact-dialog-label {
            font-size: 14.5px;
            color: #3d2b1f;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-all;
            flex: 1;
            min-width: 0;
        }

        .contact-dialog-label strong {
            color: #8b1a1a;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body id="contact-page">
    <!-- 汉堡菜单 -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 导航抽屉 -->
    <div class="drawer" id="drawer">
        <div class="drawer-header">菜单</div>
        <ul class="nav-list">
            <li class="nav-item" data-href="index.html">课程介绍</li>
            <li class="nav-item" data-href="gallery.html">成品展示</li>
            <li class="nav-item" data-href="environment.html">环境设施</li>
            <li class="nav-item active" data-href="contact.html">联系咨询</li>
        </ul>
    </div>

    <!-- 联系咨询：聊天界面 -->
    <div class="article">
        <!-- 顶部导航栏 -->
        <div class="chat-appbar">
            <div class="chat-appbar-title">自助咨询</div>
        </div>

        <!-- 消息主体区域（可滚动） -->
        <div class="chat-body" id="chatBody">
            <!-- 机器人欢迎消息 -->
            <div class="msg-row msg-row-other">
                <div class="msg-main">
                    <div class="msg-bubble">您好，欢迎咨询藏服培训课程，请问有什么能帮您</div>
                </div>
            </div>

            <!-- 快捷问题按钮组 -->
            <div class="quick-group" id="quickGroup">
                <button class="quick-btn" data-q="课程多少钱？要学多久？">课程多少钱？要学多久？</button>
                <button class="quick-btn" data-q="课程涉及哪些内容？">课程涉及哪些内容？</button>
                <button class="quick-btn" data-q="学完之后还有疑问怎么办？">学完之后还有疑问怎么办？</button>
                <button class="quick-btn" data-q="不同地域有不同款式怎么办？">不同地域有不同款式怎么办？</button>
            </div>
        </div>
    </div>

    <!-- 底部通栏：联系老师（固定悬浮） -->
    <div class="contact-footer-bar">
        <button class="contact-footer-btn" id="contactFooterBtn">联系老师</button>
    </div>

    <!-- 联系老师弹窗 -->
    <div class="contact-dialog-mask" id="contactDialogMask">
        <div class="contact-dialog-card" id="contactDialogCard">
            <div class="contact-dialog-row">
                <div class="contact-dialog-label">联系微信：<strong>xu963333aa</strong></div>
            </div>
            <div class="contact-dialog-row">
                <div class="contact-dialog-label">联系电话：<strong>13330989470</strong></div>
            </div>
        </div>
    </div>

    <script>
        const hamburger = document.getElementById('hamburger');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');

        function openDrawer() {
            drawer.classList.add('active');
            overlay.classList.add('active');
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
        }

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            if (drawer.classList.contains('active')) {
                closeDrawer();
            } else {
                openDrawer();
            }
        });

        overlay.addEventListener('click', closeDrawer);

        /* 导航项点击：跳转到对应的独立 HTML 文件 */
        document.querySelectorAll('.nav-item').forEach(function(item) {
            item.addEventListener('click', function() {
                closeDrawer();
                const href = this.getAttribute('data-href');
                if (href && href !== window.location.pathname.split('/').pop()) {
                    window.location.href = href;
                }
            });
        });

        /* ===== 联系咨询：聊天交互 ===== */
        const chatReplyMap = {
            '课程多少钱？要学多久？': '费用包含工具场地使用费和咨询费5600元，材料费300。\n课程学习有效期一个月',
            '课程涉及哪些内容？': '课程包含量体，放量，排料，手工打版，缝纫工艺流程及技巧，识别面料，服装配色，熨烫，上拉链，开袋，开叉，镶边，上领袖变化等内容。直到做出各种款式的衣服，共计做出11件不同款的成品出来',
            '学完之后还有疑问怎么办？': '课程学完后在家练习，不懂的可以微信视频一对一解决。',
            '不同地域有不同款式怎么办？': '民族服装每个地方有所不同，可与老师沟通具体学习款式。以上课程选一到两件也可换成自己想学的款式。'
        };

        let chatInitialized = false;

        function initChat() {
            if (chatInitialized) return;
            chatInitialized = true;

            const chatBody = document.getElementById('chatBody');
            const quickGroup = document.getElementById('quickGroup');
            if (!chatBody || !quickGroup) return;

            quickGroup.querySelectorAll('.quick-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const question = this.getAttribute('data-q');
                    if (!question) return;

                    appendUserMsg(question);
                    scrollChatBottom();

                    setTimeout(function() {
                        const reply = chatReplyMap[question] || '感谢您的咨询，我们会尽快为您解答。';
                        appendBotMsg(reply);
                        scrollChatBottom();
                    }, 450);
                });
            });
        }

        function appendUserMsg(text) {
            const chatBody = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = 'msg-row msg-row-self';
            row.innerHTML =
                '<div class="msg-main">' +
                    '<div class="msg-bubble">' + escapeHtml(text) + '</div>' +
                '</div>';
            chatBody.appendChild(row);
            scheduleScrollBottom();
        }

        function appendBotMsg(text) {
            const chatBody = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = 'msg-row msg-row-other';
            row.innerHTML =
                '<div class="msg-main">' +
                    '<div class="msg-bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>' +
                '</div>';
            chatBody.appendChild(row);
            scheduleScrollBottom();
        }

        function scrollChatBottom() {
            const chatBody = document.getElementById('chatBody');
            if (chatBody) {
                chatBody.scrollTop = chatBody.scrollHeight;
            }
            /* 兜底：如果滚动容器是整个页面而不是 chat-body，也同步滚到页面底部 */
            try {
                window.scrollTo(0, document.body.scrollHeight);
            } catch (e) {}
        }

        /* 等待浏览器完成重排后再滚动到底部，多轮重试确保在移动端/不同浏览器下生效 */
        function scheduleScrollBottom() {
            const delays = [0, 32, 100, 260];
            delays.forEach(function(d) {
                setTimeout(function() {
                    requestAnimationFrame(function() {
                        scrollChatBottom();
                    });
                }, d);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* 页面加载即初始化聊天 */
        document.addEventListener('DOMContentLoaded', function() {
            initChat();
            setTimeout(scrollChatBottom, 100);
        });

        /* 底部通栏「联系老师」按钮：打开联系弹窗 */
        const contactFooterBtn = document.getElementById('contactFooterBtn');
        const contactDialogMask = document.getElementById('contactDialogMask');
        const contactDialogCard = document.getElementById('contactDialogCard');

        function openContactDialog() {
            if (contactDialogMask) {
                contactDialogMask.classList.add('show');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeContactDialog() {
            if (contactDialogMask) {
                contactDialogMask.classList.remove('show');
                document.body.style.overflow = '';
            }
        }

        if (contactFooterBtn) {
            contactFooterBtn.addEventListener('click', openContactDialog);
        }

        /* 点击遮罩（非卡片区域）关闭弹窗 */
        if (contactDialogMask) {
            contactDialogMask.addEventListener('click', function(e) {
                if (e.target === contactDialogMask) {
                    closeContactDialog();
                }
            });
        }
    </script>
</body>
</html>
